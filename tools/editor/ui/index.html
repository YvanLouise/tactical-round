<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tactical Round · 网站编辑站</title>
  <link rel="icon" href="/tactical-round/assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./editor.css"><script src="./editor.js" type="module"></script>
</head>
<body>
  <svg class="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-home" viewBox="0 0 24 24"><path d="m3 11 9-8 9 8M6 9v12h5v-7h3v7h4V9"/></symbol>
    <symbol id="i-game" viewBox="0 0 24 24"><path d="M7 6h10l3 3 2 9-3 2-4-4H9l-4 4-3-2 2-9Z M7 9v6m-3-3h6M16 10h.1M19 13h.1"/></symbol>
    <symbol id="i-box" viewBox="0 0 24 24"><path d="m12 2 9 5v10l-9 5-9-5V7Zm0 10L3 7m9 5 9-5m-9 5v10"/></symbol>
    <symbol id="i-world" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><ellipse cx="12" cy="12" rx="4" ry="10"/><path d="M2 12h20"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><path d="M3 3h7v7H3Zm11 11h7v7h-7ZM3 14h7v7H3Zm11-4V3h7"/></symbol>
    <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9 8a3 3 0 0 1 6 0c0 3-3 2-3 5m0 4h.1"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="m9 3 1-2h4l1 2 3 2 3 1 1 4-2 2-1 3v3l-3 3-3-1-3-1-2-1-3-3 1-3V8l2-3Z"/><circle cx="12" cy="12" r="4"/></symbol>
    <symbol id="i-document" viewBox="0 0 24 24"><path d="M5 2h9l5 5v15H5ZM14 2v6h5M8 12h8m-8 4h8"/></symbol>
    <symbol id="i-monitor" viewBox="0 0 24 24"><path d="M2 3h20v14H2Zm10 14v5m-5 0h10"/></symbol>
    <symbol id="i-phone" viewBox="0 0 24 24"><rect x="6" y="1" width="12" height="22" rx="1"/><path d="M11 19h2"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 17V2m-5 5 5-5 5 5M3 16v6h18v-6"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M2 5h8l2 3h10v13H2Z"/></symbol>
    <symbol id="i-external" viewBox="0 0 24 24"><path d="M13 3h8v8m0-8L10 14M9 4H3v17h17v-7"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m5 5 14 14M5 19 19 5"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 10v7m0-11h.1"/></symbol>
  </svg>
  <header class="toolbar">
    <div class="app-brand"><img src="/tactical-round/assets/icon.svg" alt="" width="40" height="40"><h1>网站编辑站</h1><span>TACTICAL ROUND</span></div>
    <div class="actions"><span id="save-status" role="status">正在读取…</span><button id="reload" class="button" type="button">重新载入</button><button id="save" class="button" type="button" disabled>保存更改</button><button id="deploy" class="button primary" type="button" disabled><svg class="icon"><use href="#i-upload"/></svg>一键上线</button></div>
  </header>
  <main class="workspace">
    <aside class="sidebar"><h2>页面内容</h2><nav id="sections" aria-label="编辑区块"></nav><div class="sidebar-bottom"><span>本地编辑</span><p>保存到网站文件</p><a href="https://github.com/YvanLouise/tactical-round" target="_blank" rel="noopener noreferrer">GitHub 仓库 <svg class="icon"><use href="#i-external"/></svg></a></div></aside>
    <section class="edit-pane" aria-labelledby="section-title"><div class="pane-heading"><h2 id="section-title">首页</h2><p id="section-description">修改文案与主视觉</p></div><form id="fields" autocomplete="off"></form><label id="readme-label" for="readme-source" hidden>README.md</label><textarea id="readme-source" aria-label="GitHub README 内容" spellcheck="false" hidden></textarea></section>
    <section class="preview-pane" aria-labelledby="preview-title">
      <div class="preview-toolbar"><h2 id="preview-title">实时预览</h2><div id="viewport-tools"><button id="desktop" class="viewport-button selected" aria-pressed="true" type="button"><svg class="icon"><use href="#i-monitor"/></svg>桌面</button><button id="mobile" class="viewport-button" aria-pressed="false" type="button"><svg class="icon"><use href="#i-phone"/></svg>手机</button><a href="/tactical-round/" target="_blank" rel="noopener noreferrer" title="查看已保存的网站"><svg class="icon"><use href="#i-external"/></svg><span>另开预览</span></a></div><span id="readme-preview-note" hidden>仅预览</span></div>
      <div class="preview-stage" id="preview-stage"><div id="frame-wrap"><iframe id="site-preview" title="网站实时预览" src="/tactical-round/"></iframe></div><iframe id="readme-preview" title="README Markdown 预览" sandbox="allow-popups" hidden></iframe></div>
      <div class="deployment" id="deployment" role="status" hidden><h3>部署到 GitHub Pages</h3><ol><li data-step="saving">保存文件</li><li data-step="push">提交并推送</li><li data-step="pages">Pages 部署</li></ol><p id="deployment-message"></p><a id="deployment-link" href="https://yvanlouise.github.io/tactical-round/" target="_blank" rel="noopener noreferrer" hidden>打开线上网站 <svg class="icon"><use href="#i-external"/></svg></a></div>
    </section>
  </main>
  <footer class="statusbar"><svg class="icon"><use href="#i-info"/></svg><span id="message" aria-live="polite">修改后先预览，保存到本机。点击「一键上线」即可发布到 GitHub Pages。</span></footer>
  <dialog id="asset-dialog" aria-labelledby="asset-title"><div class="dialog-header"><h2 id="asset-title">选择素材</h2><button class="icon-button" id="close-assets" aria-label="关闭素材库" type="button"><svg class="icon"><use href="#i-close"/></svg></button></div><p>点击一张图片替换当前配图。要用新图片，请关闭窗口后选择「上传图片」。</p><div id="asset-list" class="asset-list"></div></dialog>
  <input type="file" id="upload" accept="image/png,image/jpeg,image/webp,image/gif" hidden>
</body>
</html>
